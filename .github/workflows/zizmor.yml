name: zizmor

# Static analysis of GitHub Actions workflows: template injection, leaked
# credentials, over-broad permissions and unpinned actions.
# https://docs.zizmor.sh/

on:
  push:
    branches: [ main ]
    paths:
      - ".github/**"
  pull_request:
    branches: [ main, master, nightly ]
    paths:
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
          min-severity: low
