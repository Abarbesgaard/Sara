name: Mutants

# Mutation testing on the lines a PR changes: each mutant is a small injected
# bug, and a "missed" one means no test noticed it. A full run is too slow for
# every PR, so this only mutates the PR's diff. Config: .cargo/mutants.toml.

on:
  pull_request:
    branches: [ main, master, nightly ]
    paths:
      - ".cargo/mutants.toml"
      - ".github/workflows/mutants.yml"
      - "Cargo.*"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  incremental-mutants:
    name: Mutants (PR diff)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Diff against base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/${BASE_REF}.." | tee git.diff

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: mutants

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-mutants

      - name: Mutants
        run: cargo mutants --no-shuffle -vV --in-place --in-diff git.diff

      - name: Archive mutants.out
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants.out
          path: mutants.out
