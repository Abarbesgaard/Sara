name: PR title

# IMP Rule 9: `fix:` is for a defect in released code, `refine:` for anything
# else. A PR title is a conventional commit, a `fix:` needs the `bug` label as
# the claim that a release is broken, and a `refine:` PR gets the `refine`
# label. Its own workflow, so editing a title or a label reruns only this.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: The title says what kind of change this is
        env:
          TITLE: ${{ github.event.pull_request.title }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          types='feat|refine|fix|docs|test|ci|build|chore|perf|revert'
          if ! printf '%s' "$TITLE" | grep -qE "^($types)(\([a-z0-9_-]+\))?!?: [^ ]"; then
            echo "::error::Start the title with a conventional commit type ($types), e.g. 'refine: …'. It is: $TITLE"
            exit 1
          fi
          type=$(printf '%s' "$TITLE" | sed -E 's/^([a-z]+).*/\1/')
          case " $LABELS " in *" bug "*) bug=1 ;; *) bug= ;; esac
          if [ "$type" = fix ] && [ -z "$bug" ]; then
            echo "::error::'fix:' is for a defect in released code: add the 'bug' label, or title it 'refine:'."
            exit 1
          fi
          if [ "$type" = refine ]; then
            case " $LABELS " in *" refine "*) ;; *) gh pr edit "$PR" --add-label refine ;; esac
          fi
          echo "$type: ok"
