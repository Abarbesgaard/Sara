name: Deploy GitHub Pages

# Publishes docs/ to GitHub Pages:
#   /       — the sara landing page
#   /spqr/  — the Adeptus Machinae showcase
#   /imp.html — how the pipeline maps to Impatient Programming, with the
#               obligation count from contract/
#   /apt/     — an apt repository holding the latest release's .deb
# release.yml calls this after each release so /apt/ serves the new version.
# Repo setup: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "contract/**"
      - ".github/workflows/pages.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel: a cancelled deploy inside a release would fail the release.
concurrency:
  group: pages
  cancel-in-progress: false

# Every step runs with -o pipefail, so `script | tee` fails when the script does.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Count the Contract's obligations
        run: |
          n=$(cat contract/*/README.md | grep -c '^### A[0-9]')
          echo "{\"obligations\": $n}" > docs/coverage.json
      - name: Add apt repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p docs/apt/pool/main docs/apt/dists/stable/main/binary-amd64
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'sara_*-*_amd64.deb' --dir docs/apt/pool/main
          cd docs/apt
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          gzip -kf dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Sara \
            -o APT::FTPArchive::Release::Label=Sara \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release
          # Optional: with APT_GPG_PRIVATE_KEY set, clients can drop [trusted=yes].
          if [ -n "${GPG_KEY:-}" ]; then
            echo "$GPG_KEY" | gpg --batch --import
            key="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
            gpg --batch --yes --default-key "$key" -abs -o dists/stable/Release.gpg dists/stable/Release
            gpg --batch --yes --default-key "$key" --clearsign -o dists/stable/InRelease dists/stable/Release
            gpg --batch --yes --armor --export "$key" > sara-archive-keyring.asc
          fi
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1