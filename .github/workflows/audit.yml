name: Security audit

# Flags dependencies with known RustSec advisories once a day, to catch
# newly published advisories against the versions we already depend on.
# PRs and pushes that change Cargo.toml/Cargo.lock are audited by the
# "Dependency policy" stage (cargo-deny) in rust.yml.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
