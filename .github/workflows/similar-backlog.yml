name: Similar code

# The PR gate (ci.yml, Policy) stops new similar functions; this shows the ones
# already in the crate as a number to bring down. Each night it prints every
# cluster to the job summary and files an issue (label similar-code, at most 3
# a night, largest first) per cluster not filed before; closing one means
# "keep it". See scripts/similar-backlog.sh.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: similar-backlog
  cancel-in-progress: false

# Every step runs with -o pipefail, so `script | tee` fails when the script does.
defaults:
  run:
    shell: bash

jobs:
  backlog:
    name: Similar code backlog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: similarity-rs
      - name: Report and file issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/similar-backlog.sh --file-issues | tee -a "$GITHUB_STEP_SUMMARY"
