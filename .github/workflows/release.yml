name: Release

# Every green merge is a release (IMP Rule 3). A PR that changes what ships
# bumps the version in Cargo.toml (ci.yml's Policy job); once CI is green on
# main, ci.yml's Release job calls this with the new tag. Run it by hand to
# redo a release.
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v2.8.0
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v2.8.0
        required: true
        type: string

permissions: {}

# Every step runs with -o pipefail, so `script | tee` fails when the script does.
defaults:
  run:
    shell: bash

jobs:
  # Tag the commit and create the GitHub Release the other jobs upload to.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --silent 2>/dev/null; then
            echo "${TAG} already exists."
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" --silent
            echo "Tagged ${GITHUB_SHA} as ${TAG}."
          fi
      - uses: taiki-e/create-gh-release-action@045e5c0ed9c50cc1f96de7e891a09ad3daea245f # v1.12.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Cross-compiled binaries (tar.gz) for Linux + macOS, attached to the release.
  # Archive names match scripts/install.sh: sara-<target>.tar.gz
  #
  # There is deliberately no `use-cross` input: it is not a valid input for
  # upload-rust-binary-action, which warned "Unexpected input(s) 'use-cross'"
  # and ignored it on every run. The action already installs and uses `cross`
  # by itself when the target needs it — the v1.4.0 aarch64-unknown-linux-gnu
  # asset was verified as a genuine `ELF 64-bit ARM aarch64` binary.
  binaries:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and upload
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: sara
          target: ${{ matrix.target }}
          archive: sara-$target
          checksum: sha256
          ref: refs/tags/${{ inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Debian package (.deb) for amd64. Uploaded both versioned (cargo-deb's name)
  # and as a stable `sara_amd64.deb` so the README's latest-download URL works.
  deb:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: cargo deb
      - name: Upload .deb to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          deb="$(find target/debian -name '*.deb' | head -n1)"
          cp "$deb" sara_amd64.deb
          sha256sum "$deb" sara_amd64.deb > sara_amd64.deb.sha256
          gh release upload "${TAG}" "$deb" sara_amd64.deb sara_amd64.deb.sha256 --clobber

  # Publish to crates.io. No-op unless the CARGO_REGISTRY_TOKEN secret is set.
  crates-io:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Publish
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "CARGO_REGISTRY_TOKEN not set — skipping crates.io publish."
            exit 0
          fi
          cargo publish --token "$TOKEN"

  # Redeploy Pages, which builds the apt repository from this release's .deb.
  apt:
    needs: deb
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: $/.github/workflows/pages.yml
