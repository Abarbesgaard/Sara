[package]
# Crate name on crates.io. `sara` and `sara-cli` are already taken, so the
# published crate is `sara-tasks` while the installed binary stays `sara`
# (see [[bin]] below).
name = "sara-tasks"
version = "1.3.0"
edition = "2024"
description = "Sara — folder-aware task manager"
license = "MIT"
authors = ["Andreas Barbesgaard"]
repository = "https://github.com/Abarbesgaard/Sara"
homepage = "https://github.com/Abarbesgaard/Sara"
readme = "README.md"
keywords = ["task", "cli", "tui", "productivity", "todo"]
categories = ["command-line-utilities"]

[[bin]]
name = "sara"
path = "src/main.rs"

# ── Debian packaging (cargo-deb) ─────────────────────────────────────────────
# Build with: cargo deb --target <triple>
[package.metadata.deb]
# Debian package name stays `sara` (crate is `sara-cli`) so `apt install sara` works.
name = "sara"
maintainer = "Andreas Barbesgaard <Abarbesgaard@users.noreply.github.com>"
copyright = "2026, Andreas Barbesgaard"
license-file = ["LICENSE", "0"]
extended-description = """
Sara is a folder-aware task manager. A git repository is treated as a project,
so tasks live alongside the code they belong to. Features include dependency
chains, a TUI board, time tracking, and a rich task guide."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/sara", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/sara/README.md", "644"],
]

[dependencies]
clap = { version = "4", features = ["derive", "unstable-ext"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rusqlite_migration = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = { version = "0.7", features = ["crossterm"] }
directories = "5"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
nucleo-matcher = "0.3"
interim = { version = "0.1", features = ["chrono"] }
base64 = "0.22"

# ── MCP server (`sara mcp`) ──────────────────────────────────────────────────
# Async runtime is built ONLY inside the `mcp` command; the rest of the CLI stays
# synchronous. rmcp is the official Rust MCP SDK (stdio transport, tokio-based).
rmcp = { version = "2", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "macros", "sync"] }
schemars = "1"

# ── Release profile ──────────────────────────────────────────────────────────
# Sara is a short-lived CLI, so the shipped artefact's size matters more than
# link-time micro-optimization. Measured on this crate (20.2 MB baseline):
#
#   strip only .................. 17.85 MB (-11.8%)   build 36s
#   strip + thin LTO ............ 18.18 MB (-10.2%)   build 41s
#   strip + thin LTO + cgu=1 .... 16.85 MB (-16.8%)   build 75s
#   strip + panic=abort ......... 15.70 MB (-22.5%)   build 28s  <- chosen
#   all of the above + fat LTO .. 15.11 MB (-25.4%)   build 72s
#
# Fat LTO buys a further 0.6 MB for +44s on every release build, and measured
# no faster at runtime (1.00x on `sara list`) because sara is dominated by
# process start-up and SQLite I/O, not by code the optimizer could improve.
# So LTO is deliberately left off; the size win comes from dropping unwinding.
#
# `panic = "abort"` is safe here: nothing unwinds deliberately (no `catch_unwind`
# anywhere in the crate), and the TUI's `panic::set_hook` terminal restore still
# runs, since the hook fires before the abort. Cargo keeps unwinding for test
# harnesses, so `#[should_panic]` tests are unaffected.
[profile.release]
panic = "abort"      # drops landing pads and unwinding tables: the bulk of the win
strip = true         # symbols are not useful in a shipped CLI
